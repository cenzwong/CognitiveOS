[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/persistence",
    "crates/kernel",
    "apps/cogctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CognitiveOS Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.13", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
async-trait = "0.1"

# Internal crates
cognitive-core = { path = "crates/core" }
cognitive-persistence = { path = "crates/persistence" }
cognitive-kernel = { path = "crates/kernel" }
